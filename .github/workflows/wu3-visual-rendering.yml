name: WU3 visual rendering

on:
  push:
    branches:
      - master
      - feature/wu3-visual-rendering
  pull_request:
    branches:
      - master
      - feature/wu3-visual-rendering
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-rendering:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / Python 3.11 / WU3 compatibility
            os: ubuntu-latest
            python: "3.11"
            full_regression: false
          - name: Ubuntu / Python 3.12 / reference regression
            os: ubuntu-latest
            python: "3.12"
            full_regression: true
          - name: Windows / Python 3.12 / reference regression
            os: windows-latest
            python: "3.12"
            full_regression: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/wu3-ci-constraints.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip==25.2" "setuptools==80.9.0"
          python -m pip install --disable-pip-version-check --no-build-isolation --constraint .github/wu3-ci-constraints.txt -e ".[test]"

      - name: Verify installed Python dependencies
        run: |
          python -m pip check
          python -m pip freeze

      # Gyan's immutable 9.0.2 release asset is the verified Windows reference
      # build. The digest is the publisher-provided SHA-256 for the ZIP asset.
      - name: Provision Gyan FFmpeg 9.0.2 essentials (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-9.0.2-essentials_build.zip"
          $destination = Join-Path $env:RUNNER_TEMP "wrld-ffmpeg-9.0.2"
          $uri = "https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip"
          $expected = "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"

          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Gyan FFmpeg archive SHA-256 mismatch: expected $expected, observed $actual"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $ffmpeg = @(Get-ChildItem -LiteralPath $destination -Filter ffmpeg.exe -File -Recurse)
          $ffprobe = @(Get-ChildItem -LiteralPath $destination -Filter ffprobe.exe -File -Recurse)
          if ($ffmpeg.Count -ne 1 -or $ffprobe.Count -ne 1) {
            throw "Expected exactly one ffmpeg.exe and one ffprobe.exe in the verified archive"
          }

          "WRLD_FFMPEG_PATH=$($ffmpeg[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WRLD_FFPROBE_PATH=$($ffprobe[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Windows FFmpeg archive SHA-256: $actual" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Linux uses a retained BtbN monthly build from FFmpeg's 9.0 release
      # branch. It is GPL/static and is not byte-identical to Gyan essentials.
      - name: Provision BtbN FFmpeg 9.0.2 release-branch build (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0.tar.xz"
          destination="$RUNNER_TEMP/wrld-ffmpeg-n9.0.2-17"
          uri="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0.tar.xz"
          expected="68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269"

          curl --fail --location --retry 3 --output "$archive" "$uri"
          echo "$expected  $archive" | sha256sum --check --strict
          mkdir -p "$destination"
          tar -xJf "$archive" -C "$destination"

          mapfile -t ffmpeg_matches < <(find "$destination" -type f -name ffmpeg -print)
          mapfile -t ffprobe_matches < <(find "$destination" -type f -name ffprobe -print)
          if [[ ${#ffmpeg_matches[@]} -ne 1 || ${#ffprobe_matches[@]} -ne 1 ]]; then
            echo "Expected exactly one ffmpeg and one ffprobe in the verified archive" >&2
            exit 1
          fi
          chmod +x "${ffmpeg_matches[0]}" "${ffprobe_matches[0]}"

          echo "WRLD_FFMPEG_PATH=$(realpath "${ffmpeg_matches[0]}")" >> "$GITHUB_ENV"
          echo "WRLD_FFPROBE_PATH=$(realpath "${ffprobe_matches[0]}")" >> "$GITHUB_ENV"
          echo "Linux FFmpeg archive SHA-256: $expected" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify FFmpeg and FFprobe capabilities
        shell: python
        run: |
          import os
          import pathlib
          import subprocess

          ffmpeg = pathlib.Path(os.environ["WRLD_FFMPEG_PATH"])
          ffprobe = pathlib.Path(os.environ["WRLD_FFPROBE_PATH"])
          if not ffmpeg.is_file() or not ffprobe.is_file():
              raise SystemExit(f"Configured media tools do not exist: {ffmpeg!s}, {ffprobe!s}")

          subprocess.run([str(ffmpeg), "-hide_banner", "-version"], check=True)
          subprocess.run([str(ffprobe), "-hide_banner", "-version"], check=True)

          def available(flag: str) -> set[str]:
              result = subprocess.run(
                  [str(ffmpeg), "-hide_banner", flag],
                  check=True,
                  capture_output=True,
                  text=True,
                  errors="replace",
              )
              return {
                  parts[1]
                  for line in result.stdout.splitlines()
                  if len(parts := line.split()) >= 2
              }

          requirements = {
              "filters": (
                  "-filters",
                  {"alphaextract", "alphamerge", "format", "geq", "hflip", "scale", "split", "transpose", "vflip", "zscale"},
              ),
              "encoders": ("-encoders", {"png", "mjpeg", "libwebp", "libwebp_anim"}),
              "decoders": ("-decoders", {"png", "mjpeg", "webp", "webp_anim"}),
          }
          for label, (flag, required) in requirements.items():
              present = available(flag)
              missing = sorted(required - present)
              print(f"Required {label}: {', '.join(sorted(required))}")
              print(f"Verified {label}: {', '.join(sorted(required & present))}")
              if missing:
                  raise SystemExit(f"Missing required FFmpeg {label}: {', '.join(missing)}")

      # WU1/WU2 already cover broad non-media Python matrices. The new 3.11
      # entry therefore runs the WU3 media suite without duplicating all older
      # tests; both 3.12 reference jobs run focused and complete regression.
      - name: Run contract tests
        if: matrix.full_regression
        run: python -m pytest backend/tests/contracts -q -ra --tb=long

      - name: Run unit tests
        if: matrix.full_regression
        run: python -m pytest backend/tests/unit -q -ra --tb=long

      - name: Run WU3 real-media integration tests
        run: python -m pytest backend/tests/integration/test_wu3_still_renderer.py -vv -rs --tb=long

      - name: Run complete backend regression suite
        if: matrix.full_regression
        run: python -m pytest backend/tests -q -ra --tb=long

      - name: Report media-tool diagnostics after failure
        if: failure()
        shell: python
        run: |
          import os
          import pathlib
          import subprocess

          for variable in ("WRLD_FFMPEG_PATH", "WRLD_FFPROBE_PATH"):
              value = os.environ.get(variable)
              print(f"{variable}={value!r}")
              if value and pathlib.Path(value).is_file():
                  subprocess.run([value, "-hide_banner", "-version"], check=False)
          ffmpeg = os.environ.get("WRLD_FFMPEG_PATH")
          if ffmpeg and pathlib.Path(ffmpeg).is_file():
              for flag in ("-filters", "-encoders", "-decoders"):
                  subprocess.run([ffmpeg, "-hide_banner", flag], check=False)
