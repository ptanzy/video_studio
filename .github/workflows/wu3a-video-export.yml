name: WU3A video export

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Run WU3A contracts and non-media regressions
        run: >-
          python -m pytest
          backend/tests/contracts/test_video_export_contracts.py
          backend/tests/unit/test_video_export_domain.py
          backend/tests/unit/test_video_project_sources.py
          backend/tests/unit/test_video_export_renderer.py
          backend/tests/unit/test_video_export_cli.py
          backend/tests/integration/test_wu3a_video_export.py
          -m "not integration_ffmpeg" -q -ra
      - run: python -m pytest backend/tests -m "not integration_ffmpeg" -q -ra
      - run: python -m compileall -q backend/src backend/tests

  real-media:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Provision verified FFmpeg 9.0.2 build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-9.0.2-essentials_build.zip"
          $destination = Join-Path $env:RUNNER_TEMP "wrld-ffmpeg-9.0.2"
          $uri = "https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip"
          $expected = "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg archive digest mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $ffmpeg = @(Get-ChildItem -LiteralPath $destination -Filter ffmpeg.exe -File -Recurse)
          $ffprobe = @(Get-ChildItem -LiteralPath $destination -Filter ffprobe.exe -File -Recurse)
          if ($ffmpeg.Count -ne 1 -or $ffprobe.Count -ne 1) { throw "Expected one FFmpeg tool pair" }
          "WRLD_FFMPEG_PATH=$($ffmpeg[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "WRLD_FFPROBE_PATH=$($ffprobe[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Provision verified FFmpeg 9.0.2 build (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg.tar.xz"
          destination="$RUNNER_TEMP/wrld-ffmpeg-9.0.2"
          uri="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0.tar.xz"
          expected="68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269"
          curl --fail --location --retry 3 --output "$archive" "$uri"
          echo "$expected  $archive" | sha256sum --check --strict
          mkdir -p "$destination"
          tar -xJf "$archive" -C "$destination"
          mapfile -t ffmpeg < <(find "$destination" -type f -name ffmpeg -print)
          mapfile -t ffprobe < <(find "$destination" -type f -name ffprobe -print)
          if [[ ${#ffmpeg[@]} -ne 1 || ${#ffprobe[@]} -ne 1 ]]; then exit 1; fi
          chmod +x "${ffmpeg[0]}" "${ffprobe[0]}"
          echo "WRLD_FFMPEG_PATH=$(realpath "${ffmpeg[0]}")" >> "$GITHUB_ENV"
          echo "WRLD_FFPROBE_PATH=$(realpath "${ffprobe[0]}")" >> "$GITHUB_ENV"
      - run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Verify WU3A and WU3B FFmpeg capabilities
        shell: python
        run: |
          import os
          import pathlib
          import subprocess

          ffmpeg = pathlib.Path(os.environ["WRLD_FFMPEG_PATH"])
          ffprobe = pathlib.Path(os.environ["WRLD_FFPROBE_PATH"])
          for tool in (ffmpeg, ffprobe):
              if not tool.is_file():
                  raise SystemExit(f"Configured media tool does not exist: {tool!s}")
              subprocess.run([str(tool), "-hide_banner", "-version"], check=True)
          result = subprocess.run(
              [str(ffmpeg), "-hide_banner", "-filters"],
              check=True,
              capture_output=True,
              text=True,
              errors="replace",
          )
          present = {
              parts[1]
              for line in result.stdout.splitlines()
              if len(parts := line.split()) >= 2
          }
          required = {
              "color", "colorchannelmixer", "crop", "drawbox", "format", "gblur",
              "overlay", "pad", "scale", "sendcmd", "setparams", "split", "zoompan",
          }
          missing = sorted(required - present)
          if missing:
              raise SystemExit(f"Missing required WU3B FFmpeg filters: {', '.join(missing)}")
      - name: Run generated-media WU3A/WU3B/Phase D vertical slices
        run: python -m pytest backend/tests/integration/test_wu3a_video_export.py -m integration_ffmpeg -q -ra --tb=long
