[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wrld-video-studio"
version = "0.1.0"
description = "Foundation package for the WRLD Video Studio local POC"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.161,<0.162",
	"jsonschema>=4.21,<5",
	"pydantic>=2.14,<3",
	"portalocker>=3.1,<4",
	"pywin32>=306; sys_platform == 'win32'",
	"uvicorn>=0.54,<0.55",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<0.29", "pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
markers = [
	"integration_ffmpeg: requires installed FFmpeg and FFprobe executables",
]
